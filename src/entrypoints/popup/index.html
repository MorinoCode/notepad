<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notewisp</title>
    <style>
      /*
       * Chrome sizes the popup from its content. Fixing the frame on the document
       * (rather than on a component) means the popup never resizes while the user
       * types or scrolls, which would be jarring. Kept out of the Tailwind sheet
       * so the options page is not affected.
       */
      html,
      body {
        width: 415px;
        height: 590px;
        overflow: hidden;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

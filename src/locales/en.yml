# Notewisp — English messages.
#
# Notes on the format:
# - Keys are referenced with `i18n.t('key')`. Nested keys are joined with dots.
# - `$1`-`$9` are substitutions, passed as an array: i18n.t('k', ['value']).
# - Prices are deliberately NOT in this file. Currency amounts belong to the
#   billing provider and are rendered by the UI, so translators never have to
#   worry about a `$` colliding with a substitution token.


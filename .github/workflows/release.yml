name: Release

on:
  push:
    tags: ["v*"]
  # Lets you produce the zips without publishing, to check them first.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the Chrome Web Store after packaging
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Refuse to ship something that does not pass its own checks.
      - name: Verify
        run: pnpm verify

      - name: Package for Chrome
        run: pnpm zip

      - name: Package for Firefox
        run: pnpm zip:firefox

      - name: Upload zips to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*-chrome.zip
            .output/*-firefox.zip
          generate_release_notes: true

      - name: Publish to the Chrome Web Store
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ]; then
            echo "Store credentials are not configured; skipping publish."
            exit 0
          fi
          pnpm wxt submit --chrome-zip .output/*-chrome.zip
